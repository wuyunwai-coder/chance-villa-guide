<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#e9e3d8">
<title>蒔裳秝景｜數位管家</title>
<style>
:root{
  --bg:#f4f0e9;--paper:#fffdf9;--text:#2f332e;--muted:#777c72;
  --green:#4f5f4b;--green2:#7f9078;--soft:#ece6dc;--line:#e4ddd2;
  --warning:#8e573f;--warning-bg:#fff3ea;--shadow:0 16px 42px rgba(56,52,45,.10)
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;color:var(--text);
  background:radial-gradient(circle at 15% 0%,rgba(255,255,255,.85),transparent 30%),
  linear-gradient(180deg,#ddd7cc 0,#f4f0e9 420px);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif
}
.wrap{width:min(100%,880px);margin:auto;padding:18px 14px 64px}
.hero{
  position:relative;overflow:hidden;min-height:390px;padding:30px 24px;border-radius:32px;color:#fff;
  background:radial-gradient(circle at 82% 18%,rgba(255,255,255,.17) 0 13%,transparent 14%),
  linear-gradient(145deg,#465343,#71806b 58%,#98a491);box-shadow:var(--shadow)
}
.hero.has-image{background-size:cover;background-position:center}
.hero.has-image:before{content:"";position:absolute;inset:0;background:linear-gradient(145deg,rgba(54,64,52,.86),rgba(83,99,77,.58))}
.hero:after{content:"";position:absolute;right:-85px;bottom:-105px;width:250px;height:250px;border:35px solid rgba(255,255,255,.08);border-radius:50%}
.hero>*{position:relative;z-index:1}
.logo{width:108px;filter:brightness(0) invert(1);opacity:.96}
.hero h1{margin:22px 0 5px;font-size:clamp(36px,9vw,56px);letter-spacing:.08em}
.en{font-size:12px;letter-spacing:.22em;opacity:.78}
.hero-copy{max-width:620px;margin:22px 0 0;line-height:1.9;font-size:14px;white-space:pre-line;opacity:.95}
.slogan{margin-top:18px;font:italic 15px Georgia,serif}
.welcome{margin-top:28px;font-size:13px;opacity:.86}

.section-label{margin:30px 4px 10px;color:var(--muted);font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.mainmenu{display:grid;grid-template-columns:1fr;gap:11px}
.mainmenu a{
  display:flex;align-items:center;justify-content:space-between;gap:15px;min-height:92px;padding:17px 18px;
  border-radius:21px;background:var(--paper);border:1px solid var(--line);color:inherit;text-decoration:none;
  box-shadow:0 8px 22px rgba(56,52,45,.055)
}
.menu-left{display:flex;align-items:center;gap:14px}
.menu-icon{display:grid;place-items:center;width:48px;height:48px;border-radius:16px;background:var(--soft);font-size:23px}
.mainmenu strong{display:block;font-size:17px;margin-bottom:4px}
.mainmenu small{color:var(--muted);line-height:1.45}
.arrow{font-size:20px;color:#a4a89f}

section.card{
  margin:18px 0;padding:22px 19px;border-radius:24px;background:var(--paper);
  border:1px solid var(--line);box-shadow:0 9px 25px rgba(56,52,45,.055);scroll-margin-top:16px
}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
h2{margin:0;font-size:23px}
.badge{padding:6px 10px;border-radius:999px;background:var(--soft);color:var(--green);font-size:12px;white-space:nowrap}
.notice{padding:14px 15px;border-left:4px solid var(--green2);border-radius:13px;background:#f4f6f1;line-height:1.75;font-size:14px}

.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}
.stat{padding:15px;border-radius:17px;background:#faf7f1;border:1px solid #ece4d9}
.stat small{display:block;color:var(--muted);margin-bottom:6px}
.stat strong{font-size:17px;color:var(--green)}
.stat.important{background:#fff3ea;border-color:#efd9ca}
.stat.important strong{color:var(--warning)}

.wifi-card{margin-top:16px;padding:17px;border-radius:19px;background:linear-gradient(135deg,#eef2eb,#f8f6f0);border:1px solid #dde5d9}
.wifi-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.wifi-title strong{font-size:17px}
.wifi-badge{padding:5px 9px;border-radius:999px;background:var(--green);color:#fff;font-size:11px}
.wifi-grid{display:grid;grid-template-columns:1fr;gap:9px}
.wifi-item{padding:12px 13px;border-radius:14px;background:#fff;border:1px solid #e6e4dc}
.wifi-item small{display:block;color:var(--muted);margin-bottom:4px}
.wifi-item b{font-size:16px;letter-spacing:.03em}
.wifi-note{margin:11px 0 0;color:var(--muted);font-size:12px;line-height:1.65}

.play-tabs{display:flex;gap:8px;margin-bottom:12px}
.play-tab{
  flex:1;border:1px solid var(--line);background:#faf7f1;color:var(--text);
  padding:11px 14px;border-radius:14px;font-weight:800;font-size:13px;cursor:pointer
}
.play-tab.active{background:var(--green);color:#fff;border-color:var(--green)}
.interactive-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
.select-card{min-height:126px;padding:15px;border-radius:18px;background:#faf7f1;border:1px solid #ece4d9;text-align:left;cursor:pointer;color:inherit;position:relative;transition:.18s}
.select-card.active{background:linear-gradient(145deg,#4f5f4b,#71806b);color:#fff;border-color:#4f5f4b;box-shadow:0 10px 22px rgba(79,95,75,.22)}
.select-card .emoji{font-size:26px}
.select-card h3{margin:9px 0 5px;font-size:16px}
.select-card p{margin:0;color:var(--muted);font-size:12px;line-height:1.55}
.select-card.active p{color:rgba(255,255,255,.78)}
.select-card .status-pill{display:inline-block;margin-top:9px;padding:4px 8px;border-radius:999px;background:#ece6dc;color:var(--green);font-size:11px;font-weight:800}
.select-card.active .status-pill{background:rgba(255,255,255,.16);color:#fff}

.detail{margin-top:16px;padding:18px;border-radius:20px;background:#f4f6f1;border:1px solid #dde5d9}
.detail-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.detail-title{display:flex;align-items:center;gap:10px}
.detail-icon{font-size:29px}
.detail h3{margin:0;font-size:20px;color:var(--green)}
.detail-sub{margin:4px 0 0;color:var(--muted);font-size:12px}
.type-tag{padding:5px 9px;border-radius:999px;background:var(--green);color:#fff;font-size:11px;white-space:nowrap}
.summary-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:14px}
.summary-item{padding:12px;border-radius:14px;background:#fff;border:1px solid #e4e4dc}
.summary-item small{display:block;color:var(--muted);font-size:11px;margin-bottom:4px}
.summary-item strong{font-size:14px}
.detail-section{padding:14px 0;border-top:1px solid #dfe5db}
.detail-section h4{margin:0 0 8px;font-size:14px;color:var(--green)}
.detail-section ul{margin:0;padding-left:20px;color:var(--muted);font-size:13px;line-height:1.75}
.detail-section p{margin:0;color:var(--muted);font-size:13px;line-height:1.75}
.alert-box{margin-top:8px;padding:12px 13px;border-radius:13px;background:#fff4de;color:#735d2e;font-size:12px;line-height:1.65}
.alert-box.important{background:#fdeceb;color:#8b3f3a}
.alert-box.info{background:#edf4fb;color:#41627a}

.device-list{
  border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#fffdf9
}
.device-list details{padding:0;border-top:1px solid var(--line)}
.device-list details:first-child{border-top:0}
.device-list summary{
  list-style:none;cursor:pointer;padding:16px;font-weight:800;background:#fffdf9;
  display:flex;align-items:center;gap:10px
}
.device-list summary::-webkit-details-marker{display:none}
.device-name{flex:1}
.device-toggle{color:var(--green2);font-size:20px;line-height:1;transition:transform .18s}
.device-list details[open] .device-toggle{transform:rotate(45deg)}
.device-content{
  padding:0 16px 16px 44px;color:var(--muted);font-size:13px;line-height:1.75;background:#fffdf9
}
.device-content p{margin:0 0 8px}
.device-content p:last-child{margin-bottom:0}
.device-empty{padding:0;color:var(--muted);font-size:13px}

.checkout-alert{padding:18px;border-radius:20px;background:var(--warning-bg);border:1px solid #efd9ca}
.alert-title{display:flex;align-items:center;gap:10px;color:var(--warning);font-weight:800;font-size:17px}
.checkout-alert>p{margin:8px 0 0;color:#785949;font-size:13px;line-height:1.7}
.reminders{display:grid;gap:10px;margin-top:14px}
.reminder{position:relative;padding:14px 14px 14px 46px;border-radius:16px;background:#fff;border:1px solid #eadfd5;font-size:14px;line-height:1.6}
.num{position:absolute;left:13px;top:13px;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--warning);color:#fff;font-size:12px;font-weight:800}
.reminder strong{display:block;margin-bottom:3px}
.checkout-time{margin-top:14px;padding:14px;border-radius:15px;background:var(--warning);color:#fff;text-align:center}
.checkout-time small{display:block;opacity:.8;margin-bottom:3px}
.checkout-time strong{font-size:20px}

.contact-box{padding:20px;border-radius:22px;background:linear-gradient(135deg,#4e5f4a,#73826e);color:#fff}
.contact-box h2{font-size:23px}
.contact-box p{margin:7px 0 0;opacity:.86;font-size:14px;line-height:1.6}
.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:16px}
.action{min-height:52px;padding:12px;border-radius:15px;background:#fff;color:var(--green);display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;font-weight:800;font-size:14px}
.action.dark{background:rgba(255,255,255,.13);color:#fff;border:1px solid rgba(255,255,255,.24)}

.manual{margin-top:30px;padding:22px 18px;border-radius:25px;background:#f1ebe2;border:1px solid #dfd5c7}
.manual-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:13px}
.manual-head p{margin:5px 0 0;color:var(--muted);font-size:13px;line-height:1.6}
.manual details{padding:14px 0;border-top:1px solid #ddd3c7}
.manual details:first-of-type{border-top:0}
.manual summary{cursor:pointer;list-style:none;font-weight:800}
.manual summary::-webkit-details-marker{display:none}
.manual summary:after{content:"＋";float:right;color:var(--green)}
.manual details[open] summary:after{content:"－"}
.manual ul,.manual p{color:var(--muted);font-size:14px;line-height:1.8}
.manual ul{padding-left:21px}
.price-list{display:grid;gap:9px;margin-top:12px}
.price-item{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:12px;border-radius:13px;background:#faf7f1;border:1px solid #eee6db}
.price-item small{color:var(--muted)}
.price-item strong{grid-row:1/3;grid-column:2;align-self:center;color:var(--green)}

footer{text-align:center;color:var(--muted);font-size:12px;line-height:1.8;margin-top:30px}
@media(min-width:700px){
  .mainmenu{grid-template-columns:repeat(2,1fr)}
  .interactive-grid{grid-template-columns:repeat(4,1fr)}
  .wifi-grid{grid-template-columns:repeat(2,1fr)}
  .summary-grid{grid-template-columns:repeat(4,1fr)}
  .hero{padding:38px}
}
</style>
</head>
<body>
<main class="wrap">
<header id="hero" class="hero">
  <img id="logo" class="logo" alt="蒔裳秝景 Logo">
  <h1 id="siteName">蒔裳秝景</h1>
  <div id="siteNameEn" class="en">CHANCE VILLA 262</div>
  <p id="intro" class="hero-copy"></p>
  <div id="slogan" class="slogan"></div>
  <div id="welcome" class="welcome"></div>
</header>

<div class="section-label">數位管家</div>
<nav id="mainMenu" class="mainmenu"></nav>
<div id="content"></div>
<footer id="footer"></footer>
</main>

<script>
const SHEET_ID="1aKPLXPdEy3QpkIst5avg1Jd5ll-37NATR9cyQQHvpFs";
const FALLBACK_LOGO=document.querySelector("#logo")?.getAttribute("src")||"";
const SHEETS=["site","navigation","stay","play","devices","guest_tools","manual","assets"];
const CACHE_VERSION="guide-v4-20260724";
const CACHE_TTL=30*60*1000;

function esc(v=""){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]))}
function bool(v){return v===true||String(v).toLowerCase()==="true"||String(v)==="1"}
function num(v,d=9999){const n=Number(v);return Number.isFinite(n)?n:d}
function visible(rows){return rows.filter(r=>r.visible===""||r.visible==null||bool(r.visible))}
function group(rows,key){return rows.reduce((a,r)=>((a[r[key]||""]??=[]).push(r),a),{})}
function cfgMap(rows){return Object.fromEntries(rows.filter(r=>r.key).map(r=>[String(r.key),r.value??""]))}
function lines(v=""){return String(v||"").split(/?
/).map(x=>x.trim()).filter(Boolean)}
function cacheKey(name){return `${CACHE_VERSION}:${SHEET_ID}:${name}`}

function readSheetCache(name){
  try{
    const raw=localStorage.getItem(cacheKey(name));
    if(!raw)return null;
    const saved=JSON.parse(raw);
    return saved&&Array.isArray(saved.rows)?saved:null;
  }catch(e){return null}
}
function writeSheetCache(name,rows){
  try{localStorage.setItem(cacheKey(name),JSON.stringify({savedAt:Date.now(),rows}))}catch(e){}
}
async function fetchSheet(name){
  const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(name)}&headers=1`;
  const res=await fetch(url,{cache:"default"});
  if(!res.ok)throw new Error(`${name} 讀取失敗`);
  const text=await res.text(),s=text.indexOf("{"),e=text.lastIndexOf("}");
  if(s<0||e<0)throw new Error(`${name} 格式錯誤`);
  const data=JSON.parse(text.slice(s,e+1));
  const cols=data.table.cols.map(c=>c.label||c.id);
  const rows=data.table.rows.map(r=>{
    const o={};cols.forEach((c,i)=>o[c]=r.c[i]?r.c[i].v:"");return o;
  });
  writeSheetCache(name,rows);
  return rows;
}
async function loadSheet(name){
  const cached=readSheetCache(name);
  if(cached&&Date.now()-cached.savedAt<CACHE_TTL)return cached.rows;
  try{return await fetchSheet(name)}
  catch(err){if(cached)return cached.rows;throw err}
}
function clearOldGuideCaches(){
  try{
    Object.keys(localStorage).forEach(key=>{
      if(key.includes(`:${SHEET_ID}:`)&&!key.startsWith(`${CACHE_VERSION}:`))localStorage.removeItem(key);
    });
  }catch(e){}
}
clearOldGuideCaches();

function renderHero(cfg){
  document.title=`${cfg.site_name||"蒔裳秝景"}｜數位管家`;
  siteName.textContent=cfg.site_name||"蒔裳秝景";
  siteNameEn.textContent=(cfg.site_name_en||"Chance Villa262").toUpperCase();
  intro.textContent=cfg.intro||"";
  slogan.textContent=cfg.slogan||"";
  welcome.textContent=cfg.welcome_text||"";
  logo.src=cfg.logo_url||FALLBACK_LOGO;
  if(cfg.hero_image_url){
    hero.classList.add("has-image");
    hero.style.backgroundImage=`url("${cfg.hero_image_url}")`;
  }
}

function renderStay(section,rows){
  const items=visible(rows).sort((a,b)=>num(a.sort)-num(b.sort));
  const cards=items.filter(r=>r.type==="card");
  const wifi=items.filter(r=>r.type==="wifi");
  return `<section id="${esc(section.section_id)}" class="card">
    <div class="head"><h2>${esc(section.title)}</h2><span class="badge">${esc(section.subtitle||"")}</span></div>
    <div class="notice">晚間 22:00 至翌日 08:00 請保持安靜；室內全面禁菸。</div>
    <div class="stats">${cards.map(s=>`<div class="stat ${esc(s.emphasis||"normal")}"><small>${esc(s.title)}</small><strong>${esc(s.value)}</strong></div>`).join("")}</div>
    ${wifi.map(w=>`<div class="wifi-card">
      <div class="wifi-title"><strong>${esc(w.icon||"📶")} ${esc(w.title)}</strong><span class="wifi-badge">${esc(w.badge||"Wi‑Fi")}</span></div>
      <div class="wifi-grid">
        <div class="wifi-item"><small>Wi‑Fi 帳號</small><b>${esc(w.ssid_rule||"")}</b></div>
        <div class="wifi-item"><small>Wi‑Fi 密碼</small><b>${esc(w.password||"")}</b></div>
      </div>
      ${w.description?`<p class="wifi-note">${esc(w.description)}</p>`:""}
    </div>`).join("")}
  </section>`;
}

function playSummaries(row){
  const result=[];
  for(let i=1;i<=4;i++){
    const label=row[`summary${i}_label`],value=row[`summary${i}_value`];
    if(label||value)result.push({label,value});
  }
  return result;
}
function renderPlaySection(section){
  return `<section id="${esc(section.section_id)}" class="card play-section">
    <div class="head"><h2>${esc(section.title)}</h2><span class="badge">${esc(section.subtitle||"")}</span></div>
    <div class="play-tabs">
      <button class="play-tab active" data-category="facility">公共設施</button>
      <button class="play-tab" data-category="rental">租借項目</button>
    </div>
    <div class="interactive-grid"></div>
    <div class="detail"></div>
  </section>`;
}
function bindPlay(sectionEl,rows){
  const all=visible(rows).sort((a,b)=>num(a.sort)-num(b.sort));
  let category=all.some(x=>x.category==="facility")?"facility":"rental";
  let selected=all.find(x=>x.category===category)?.play_id||"";
  const grid=sectionEl.querySelector(".interactive-grid");
  const detail=sectionEl.querySelector(".detail");

  function renderCards(){
    const filtered=all.filter(x=>x.category===category);
    if(!filtered.some(x=>String(x.play_id)===String(selected)))selected=filtered[0]?.play_id||"";
    grid.innerHTML=filtered.map(x=>`<button class="select-card ${String(x.play_id)===String(selected)?"active":""}" data-id="${esc(x.play_id)}">
      <div class="emoji">${esc(x.icon||"")}</div>
      <h3>${esc(x.name)}</h3>
      <p>${esc(x.short_description||"")}</p>
      ${x.status_label?`<span class="status-pill">${esc(x.status_label)}</span>`:""}
    </button>`).join("");
    grid.querySelectorAll(".select-card").forEach(btn=>btn.addEventListener("click",()=>{
      selected=btn.dataset.id;renderCards();renderDetail();
      detail.scrollIntoView({behavior:"smooth",block:"nearest"});
    }));
  }

  function renderDetail(){
    const x=all.find(r=>String(r.play_id)===String(selected));
    if(!x){detail.innerHTML="";return}
    const summaries=playSummaries(x);
    const instructionLines=lines(x.instructions);
    const ruleLines=lines(x.rules);
    detail.innerHTML=`<div class="detail-head">
      <div class="detail-title"><span class="detail-icon">${esc(x.icon||"")}</span><div><h3>${esc(x.name)}</h3><div class="detail-sub">${esc(x.short_description||"")}</div></div></div>
      ${x.status_label?`<span class="type-tag">${esc(x.status_label)}</span>`:""}
    </div>
    ${summaries.length?`<div class="summary-grid">${summaries.map(s=>`<div class="summary-item"><small>${esc(s.label)}</small><strong>${esc(s.value)}</strong></div>`).join("")}</div>`:""}
    ${instructionLines.length?`<div class="detail-section"><h4>${category==="rental"?"借用方式":"使用說明"}</h4><ul>${instructionLines.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div>`:""}
    ${ruleLines.length?`<div class="detail-section"><h4>使用規範</h4><ul>${ruleLines.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div>`:""}
    ${x.notice?`<div class="detail-section"><div class="alert-box ${esc(x.notice_style||"")}">${esc(x.notice)}</div></div>`:""}`;
  }

  sectionEl.querySelectorAll(".play-tab").forEach(tab=>tab.addEventListener("click",()=>{
    sectionEl.querySelectorAll(".play-tab").forEach(t=>t.classList.remove("active"));
    tab.classList.add("active");
    category=tab.dataset.category;
    selected=all.find(x=>x.category===category)?.play_id||"";
    renderCards();renderDetail();
  }));
  renderCards();renderDetail();
}

function renderDevices(section,rows){
  const items=visible(rows).sort((a,b)=>num(a.sort)-num(b.sort));
  return `<section id="${esc(section.section_id)}" class="card">
    <div class="head"><h2>${esc(section.title)}</h2><span class="badge">${esc(section.subtitle||"")}</span></div>
    <div class="device-list">
      ${items.map(x=>`<details>
        <summary><span>${esc(x.icon||"")}</span><span class="device-name">${esc(x.name)}</span><span class="device-toggle">＋</span></summary>
        <div class="device-content">
          ${x.image_url?`<img class="media" src="${esc(x.image_url)}" alt="${esc(x.name)}" loading="lazy">`:""}
          ${lines(x.description).length?lines(x.description).map(t=>`<p>${esc(t)}</p>`).join(""):`<div class="device-empty">設備說明後續補充。</div>`}
        </div>
      </details>`).join("")}
    </div>
  </section>`;
}

function renderCheckout(section,rows){
  const data=visible(rows.filter(r=>r.type==="checkout")).sort((a,b)=>num(a.sort)-num(b.sort));
  const standard=data.filter(r=>r.emphasis!=="time");
  const time=data.find(r=>r.emphasis==="time");
  return `<section id="${esc(section.section_id)}" class="card">
    <div class="head"><h2>${esc(section.title)}</h2><span class="badge">${esc(section.subtitle||"")}</span></div>
    <div class="checkout-alert">
      <div class="alert-title">⚠️ 離開前請再次確認</div>
      <p>為避免遺失物品或產生額外費用，退房前請依序確認下列事項。</p>
      <div class="reminders">${standard.map(r=>`<div class="reminder"><span class="num">${esc(r.step_no)}</span><strong>${esc(r.title)}</strong>${esc(r.content)}</div>`).join("")}</div>
      ${time?`<div class="checkout-time"><small>${esc(time.title)}</small><strong>${esc(time.content)}</strong></div>`:""}
    </div>
  </section>`;
}
function actionHref(a){
  const t=String(a.action_type||""),v=String(a.value||"");
  if(t==="tel")return `tel:${v}`;
  if(t==="email")return `mailto:${v}`;
  if(t==="section")return `#${v}`;
  return v;
}
function renderContact(section,rows){
  const actions=visible(rows.filter(r=>r.type==="action")).sort((a,b)=>num(a.sort)-num(b.sort)).filter(a=>a.value);
  return `<section id="${esc(section.section_id)}" class="contact-box">
    <h2>${esc(section.title)}</h2>
    <p>入住期間有任何問題，都可以透過下方方式聯絡我們。</p>
    <div class="actions">${actions.map((a,i)=>{
      const target=String(a.open_mode)==="new_tab"?' target="_blank" rel="noopener"':"";
      return `<a class="action ${i>1?"dark":""}" href="${esc(actionHref(a))}"${target}>${esc(a.icon||"")} ${esc(a.title)}</a>`;
    }).join("")}</div>
  </section>`;
}

function renderManual(section,rows){
  const items=visible(rows).sort((a,b)=>num(a.section_sort)-num(b.section_sort)||num(a.item_sort)-num(b.item_sort));
  const grouped=group(items,"manual_id");
  const sections=Object.values(grouped).map(rs=>rs[0]).sort((a,b)=>num(a.section_sort)-num(b.section_sort));
  return `<section id="${esc(section.section_id)}" class="manual">
    <div class="manual-head"><div><h2>${esc(section.icon||"📖")} ${esc(section.title)}</h2><p>${esc(section.subtitle||"")}</p></div><span class="badge">完整內容</span></div>
    ${sections.map(s=>{
      const rs=grouped[s.manual_id]||[];
      if(s.layout==="price_list"){
        return `<details ${bool(s.default_open)?"open":""}><summary>${esc(s.section_icon||"")} ${esc(s.section_title)}</summary>
          <div class="price-list">${rs.map(r=>`<div class="price-item"><b>${esc(r.item_title)}</b><small>${esc(r.content)}</small><strong>${esc(r.extra)}</strong></div>`).join("")}</div>
        </details>`;
      }
      const subgroups=group(rs,"group_title");
      return `<details ${bool(s.default_open)?"open":""}><summary>${esc(s.section_icon||"")} ${esc(s.section_title)}</summary>
        ${Object.entries(subgroups).map(([g,list])=>`<div><p><strong>${esc(g)}</strong></p><ul>${list.map(r=>`<li><strong>${esc(r.item_title)}</strong>${r.content?`：${esc(r.content)}`:""}</li>`).join("")}</ul></div>`).join("")}
      </details>`;
    }).join("")}
  </section>`;
}

async function init(){
  try{
    const [siteRows,navigationRows,stayRows,playRows,deviceRows,guestRows,manualRows,assetRows]=await Promise.all(SHEETS.map(loadSheet));
    const cfg=cfgMap(siteRows);renderHero(cfg);

    const sections=visible(navigationRows).sort((a,b)=>num(a.sort)-num(b.sort));
    mainMenu.innerHTML=sections.filter(s=>bool(s.show_in_menu)).map(s=>`
      <a href="#${esc(s.section_id)}"><div class="menu-left"><div class="menu-icon">${esc(s.icon||"")}</div>
      <div><strong>${esc(s.title)}</strong><small>${esc(s.description||"")}</small></div></div><span class="arrow">›</span></a>
    `).join("");

    let html="";
    sections.forEach(s=>{
      if(s.section_id==="stay")html+=renderStay(s,stayRows);
      else if(s.section_id==="play")html+=renderPlaySection(s);
      else if(s.section_id==="devices")html+=renderDevices(s,deviceRows);
      else if(s.section_id==="checkout")html+=renderCheckout(s,guestRows);
      else if(s.section_id==="contact")html+=renderContact(s,guestRows);
      else if(s.section_id==="manual")html+=renderManual(s,manualRows);
    });
    content.innerHTML=html;

    const playEl=document.querySelector(".play-section");
    if(playEl)bindPlay(playEl,playRows);

    footer.innerHTML=`${esc(cfg.site_name||"蒔裳秝景")} ${esc(cfg.site_name_en||"Chance Villa262")}<br>${esc(cfg.footer_text||"")}`;
  }catch(err){
    console.error(err);
    renderHero({site_name:"蒔裳秝景",site_name_en:"Chance Villa262",slogan:"Give you a chance to change your life."});
  }
}
init();
</script>
